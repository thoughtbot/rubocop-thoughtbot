name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Endpoints only: the oldest Ruby the gemspec supports, current stable,
        # and the newest. Intermediate versions rarely fail on their own, and
        # TargetRubyVersion already catches version-inappropriate syntax.
        ruby:
          - '3.4'
          - '4.0'
        include:
          # ruby/setup-ruby does not ship Ruby 3.0 for ubuntu-24.04, which is
          # what ubuntu-latest now resolves to.
          - ruby: '3.0'
            os: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake
